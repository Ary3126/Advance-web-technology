# ==============================================================================
# UNIFIED AWT MASTER PLATFORM - DOCKER COMPOSE ORCHESTRATION (Practical 11)
# ==============================================================================
# Defines a multi-container stack:
# 1. mongodb: Official MongoDB 7 with persistent volume and healthcheck
# 2. backend: Express 5 API with JWT, Mongoose, node-cache, and EventEmitter
# 3. frontend: Nginx reverse proxy serving React 19 SPA with SPA fallback
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Database Service: MongoDB 7
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: awt-unified-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - awt-mongo-data:/data/db
    networks:
      - awt-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Backend API Service: Node.js / Express 5
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awt-unified-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/unifiedAwtHub
      JWT_SECRET: production-secret-awt-unified-platform-2026
      CACHE_TTL_SECONDS: 60
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - awt-network

  # ----------------------------------------------------------------------------
  # Frontend Service: React 19 SPA + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awt-unified-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "8080:80"
    depends_on:
      - backend
    networks:
      - awt-network

# ------------------------------------------------------------------------------
# Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  awt-network:
    driver: bridge

volumes:
  awt-mongo-data:
    driver: local

